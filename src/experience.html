<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0e0e10;
    color: #d9d6ee;
    font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  #app {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px 4px;
    flex-wrap: wrap;
  }
  .orbs { display: flex; gap: 8px; }
  .orb {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #1f2a8a;
    background: radial-gradient(circle at 35% 30%, #9aa0ff, #1f2a8a 58%, #12121a 80%);
    color: #f4f2ff;
    font: 600 13px/36px ui-monospace, Menlo, Consolas, monospace;
    cursor: pointer;
    box-shadow: inset 0 0 8px rgba(180, 190, 255, 0.25);
  }
  .orb[aria-pressed="true"] {
    box-shadow: 0 0 16px rgba(150, 170, 255, 0.85), inset 0 0 10px rgba(220, 220, 255, 0.45);
  }
  #begin {
    margin-left: auto;
    border: 1px solid #1f2a8a;
    background: #141428;
    color: #e4e2ff;
    border-radius: 999px;
    padding: 8px 14px;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
    cursor: pointer;
  }
  #begin:disabled { opacity: 0.7; cursor: default; }
  #scale {
    color: #9d99b8;
    font-size: 11px;
    letter-spacing: 0.02em;
  }
  canvas {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  #caption, #collapse-note, footer, #isotope-note {
    pointer-events: none;
  }
  #caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 52px;
    margin: 0;
    padding: 0 14px;
    text-align: center;
    font-size: 12px;
    color: #c9c6e2;
    opacity: 0;
    animation: rise 1.8s ease 0.5s forwards;
  }
  #collapse-note {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 36px;
    margin: 0;
    min-height: 1.1em;
    text-align: center;
    font-size: 11px;
    color: #b7b3d4;
  }
  #isotope-note {
    position: absolute;
    left: 0;
    right: 0;
    top: 22%;
    margin: 0;
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: #f4f2ff;
    opacity: 0;
  }
  #isotope-note.show {
    animation: isotope-note 3s ease forwards;
  }
  footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 20px;
    margin: 0;
    text-align: center;
    font-size: 11px;
    color: #8e8aa6;
  }
  #intro {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(11, 11, 13, 0.96);
    padding: 18px 16px 22px;
  }
  #intro[hidden] { display: none; }
  #intro-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    width: min(920px, 96%);
  }
  #intro figure { margin: 0; }
  #intro img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: #000;
    border-radius: 10px;
    box-shadow: 0 0 28px rgba(43, 53, 200, 0.45);
  }
  #intro figcaption {
    margin-top: 6px;
    text-align: center;
    font-size: 11px;
    color: #eceae4;
  }
  #intro-caption {
    margin: 0;
    text-align: center;
    font-size: 13px;
    color: #eceae4;
  }
  @media (max-height: 560px) {
    #intro { gap: 8px; padding: 8px 10px 10px; }
    #intro-row { gap: 8px; }
    #intro img { max-height: 42vh; }
    #intro figcaption { font-size: 10px; }
    #intro-caption { font-size: 12px; }
  }
  @keyframes rise { to { opacity: 1; } }
  @keyframes isotope-note {
    0% { opacity: 0; }
    12% { opacity: 1; }
    72% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="orbs" id="orbs"></div>
    <span id="scale"></span>
    <button id="begin" type="button">Begin</button>
  </header>
  <canvas id="view"></canvas>
  <div id="intro" hidden>
    <div id="intro-row">
      <figure>
        <img id="intro-donor" alt="Donor">
        <figcaption>donor</figcaption>
      </figure>
      <figure>
        <img id="intro-teleblur" alt="Teleblur">
        <figcaption>Teleblur</figcaption>
      </figure>
      <figure>
        <img id="intro-acceptor" alt="Acceptor">
        <figcaption>acceptor</figcaption>
      </figure>
    </div>
    <p id="intro-caption">Donor → acceptor, through Moth Teleblur</p>
  </div>
  <p id="isotope-note"></p>
  <p id="caption">Tap to observe. Headphones on: listen to the proton pass through the wall.</p>
  <p id="collapse-note"></p>
  <footer>Time is slowed for human perception. Period ratios between isotopes are physical.</footer>
</div>
<script id="experience-data" type="application/json">__EXPERIENCE_DATA__</script>
<script id="bank-data" type="application/json">__BANK_DATA__</script>
<script id="atlas-data" type="application/json">__ATLAS_BANK__</script>
<script id="intro-data" type="application/json">__INTRO_FRAMES__</script>
<script>
const DATA = JSON.parse(document.getElementById("experience-data").textContent);
const BANK = JSON.parse(document.getElementById("bank-data").textContent);
const ATLAS = JSON.parse(document.getElementById("atlas-data").textContent);
const INTRO = JSON.parse(document.getElementById("intro-data").textContent);
let blochSpin = 0.6;
const ISOTOPES = ["H", "D", "T"];
const NAMES = { H: "hydrogen", D: "deuterium", T: "tritium" };
const F0 = DATA.isotopes.H.f0_hz;
const NPART = 92;
const TAU = Math.PI * 2;

const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d", { alpha: false });
const scaleLabel = document.getElementById("scale");
const timeExponent = Math.round(Math.log10(DATA.time_scale));
scaleLabel.innerHTML = "time slowed ~10<sup>" + timeExponent + "</sup>×";

const clocks = { H: 0, D: 0, T: 0 };
const mirrored = { H: false, D: false, T: false };
let active = "H";
let previous = "H";
let mix = 1;
let flash = 0;
const E0_OF = {
  H: DATA.isotopes.H.e0_ev,
  D: DATA.isotopes.D.e0_ev,
  T: DATA.isotopes.T.e0_ev,
};
let energyFrom = E0_OF.H;
let energyTo = E0_OF.H;
let energyMix = 1;
let audio = null;
const trails = Array.from({ length: NPART }, () => []);
let particleQ = [];
let particleU = [];
reshuffleParticles();

const glow = document.createElement("canvas");
function glowLayer(w, h) {
  if (glow.width !== w || glow.height !== h) {
    glow.width = w;
    glow.height = h;
  }
  return glow;
}

let densityMax = 1e-4;
for (const name of ISOTOPES) {
  for (const frame of DATA.isotopes[name].density) {
    for (let i = 0; i < frame.length; i++) {
      if (frame[i] > densityMax) densityMax = frame[i];
    }
  }
}

const orbs = document.getElementById("orbs");
for (const name of ISOTOPES) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "orb";
  button.textContent = name;
  button.setAttribute("aria-pressed", name === active ? "true" : "false");
  button.addEventListener("click", () => selectIsotope(name));
  orbs.appendChild(button);
}

document.getElementById("begin").addEventListener("click", (event) => {
  event.stopPropagation();
  beginAudio();
});
canvas.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 && event.pointerType === "mouse") return;
  measure();
});

function selectIsotope(name) {
  if (name === active && mix === 1) return;
  const changed = name !== active;
  previous = active;
  active = name;
  mix = 0;
  for (const button of orbs.children) {
    button.setAttribute("aria-pressed", button.textContent === name ? "true" : "false");
  }
  if (changed) {
    energyFrom = currentE0();
    energyTo = E0_OF[name];
    energyMix = 0;
    showIsotopeNote(name);
  }
  if (audio) retune(audio.ctx.currentTime);
}

function currentE0() {
  return energyFrom + (energyTo - energyFrom) * smooth(energyMix);
}

function showIsotopeNote(name) {
  const movie = DATA.isotopes[name];
  const note = document.getElementById("isotope-note");
  note.textContent = name === "H"
    ? "hydrogen · reference"
    : NAMES[name] + " · " + formatRatio(movie.period_ratio_to_h) + "× slower";
  note.classList.remove("show");
  void note.offsetWidth;
  note.classList.add("show");
}

function formatRatio(value) {
  return Number(value).toFixed(3).replace(/\.?0+$/, "");
}

function periodFraction(name) {
  const movie = DATA.isotopes[name];
  let wrapped = clocks[name] % movie.screen_period_s;
  if (wrapped < 0) wrapped += movie.screen_period_s;
  return movie.screen_period_s > 0 ? wrapped / movie.screen_period_s : 0;
}

function pointIndex(frac, count) {
  return ((Math.round(frac * count) % count) + count) % count;
}

function measure() {
  mix = 1;
  previous = active;
  const frac = periodFraction(active);
  const note = document.getElementById("collapse-note");
  let donorProb;
  if (ATLAS && Array.isArray(ATLAS.points) && ATLAS.points.length) {
    const points = ATLAS.points;
    const sample = points[pointIndex(frac, points.length)];
    const acceptor = Number(sample.acceptor_population);
    donorProb = mirrored[active] ? acceptor : (1 - acceptor);
    const provider = ATLAS.provider || "aer";
    const backend = ATLAS.backend || "automatic";
    note.textContent = "collapse drawn from Moth Atlas · tomography · " + provider + "/" + backend;
  } else {
    const points = BANK.points;
    const counts = points[pointIndex(frac, points.length)].counts;
    const n0 = Number(counts["0"] || 0);
    const n1 = Number(counts["1"] || 0);
    const total = Math.max(1, n0 + n1);
    const donorCount = mirrored[active] ? n1 : n0;
    donorProb = donorCount / total;
    note.textContent = "collapse drawn from " + BANK.source + " because atlas_bank.json is missing";
  }
  const donorWell = Math.random() < donorProb;
  mirrored[active] = !donorWell;
  clocks[active] = 0;
  flash = 1;
  reshuffleParticles();
  if (audio) ringBell();
}

function reshuffleParticles() {
  particleQ = [];
  particleU = [];
  for (let p = 0; p < NPART; p++) {
    const jitter = (Math.random() - 0.5) * 0.85;
    particleQ.push(Math.min(0.995, Math.max(0.005, (p + 0.5 + jitter) / NPART)));
    particleU.push(0.18 + Math.random() * 0.64);
  }
  trails.forEach((trail) => { trail.length = 0; });
}

function displayed(blend) {
  const from = sampleMovie(previous, clocks[previous], mirrored[previous]);
  const to = sampleMovie(active, clocks[active], mirrored[active]);
  const t = smooth(blend);
  return blendFields(from, to, t);
}

function sampleMovie(name, time, mirror) {
  const movie = DATA.isotopes[name];
  const frames = movie.density.length;
  const span = movie.screen_period_s * DATA.periods;
  let wrapped = time % span;
  if (wrapped < 0) wrapped += span;
  const pos = wrapped / span * (frames - 1);
  const i0 = Math.floor(pos);
  const i1 = Math.min(frames - 1, i0 + 1);
  const local = pos - i0;
  const n = movie.density[0].length;
  const density = new Float32Array(n);
  const phase = new Float32Array(n);
  const d0 = movie.density[i0];
  const d1 = movie.density[i1];
  const p0 = movie.phase[i0];
  const p1 = movie.phase[i1];
  for (let i = 0; i < n; i++) {
    const j = mirror ? n - 1 - i : i;
    density[i] = d0[j] * (1 - local) + d1[j] * local;
    phase[i] = lerpAngle(p0[j], p1[j], local);
  }
  let donor = movie.donor[i0] * (1 - local) + movie.donor[i1] * local;
  let acceptor = movie.acceptor[i0] * (1 - local) + movie.acceptor[i1] * local;
  if (mirror) {
    const swap = donor;
    donor = acceptor;
    acceptor = swap;
  }
  return { density, phase, donor, acceptor, movie, e0: movie.e0_ev };
}

function blendFields(from, to, t) {
  const n = from.density.length;
  const density = new Float32Array(n);
  const phase = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    density[i] = from.density[i] * (1 - t) + to.density[i] * t;
    phase[i] = lerpAngle(from.phase[i], to.phase[i], t);
  }
  const donor = from.donor * (1 - t) + to.donor * t;
  const acceptor = from.acceptor * (1 - t) + to.acceptor * t;
  return {
    density,
    phase,
    donor,
    acceptor,
    pan: Math.max(-1, Math.min(1, acceptor - donor)),
    e0: from.e0 * (1 - t) + to.e0 * t,
    movie: t < 0.5 ? from.movie : to.movie,
  };
}

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return a + d * t;
}

function smooth(t) {
  const x = Math.min(1, Math.max(0, t));
  return x * x * (3 - 2 * x);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(2, Math.floor(rect.width * dpr));
  canvas.height = Math.max(2, Math.floor(rect.height * dpr));
}
window.addEventListener("resize", resize);
resize();

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  for (const name of ISOTOPES) clocks[name] += dt;
  if (mix < 1) mix = Math.min(1, mix + dt / 0.65);
  if (energyMix < 1) energyMix = Math.min(1, energyMix + dt / 1.2);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.8);
  blochSpin += dt * 0.45;
  const state = displayed(mix);
  state.e0 = currentE0();
  draw(state);
  if (audio) followPan(state);
  if (!window.__experienceReady) window.__experienceReady = performance.now();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function layoutOf(e0) {
  const w = canvas.width;
  const h = canvas.height;
  const pad = Math.floor(w * 0.05);
  const yTop = h * 0.07;
  const yBottom = h * 0.84;
  const xs = DATA.x;
  const vs = DATA.v;
  const n = xs.length;
  let vMin = Infinity;
  let barrierIndex = 0;
  let leftWell = 0;
  let rightWell = n - 1;
  for (let i = 0; i < n; i++) {
    if (vs[i] < vMin) vMin = vs[i];
    if (Math.abs(xs[i]) < Math.abs(xs[barrierIndex])) barrierIndex = i;
    if (xs[i] < 0 && vs[i] < vs[leftWell]) leftWell = i;
    if (xs[i] > 0 && vs[i] < vs[rightWell]) rightWell = i;
  }
  const vBarrier = vs[barrierIndex];
  const e0Min = Math.min(E0_OF.H, E0_OF.D, E0_OF.T);
  const e0Max = Math.max(E0_OF.H, E0_OF.D, E0_OF.T);
  const gap = Math.max(vBarrier - e0Max, 0.02);
  const eLo = Math.min(vMin, e0Min) - 0.045;
  const eHi = vBarrier + 0.62 * Math.max(vBarrier - e0Min, gap);
  const waveAmp = 0.55 * gap;
  const xSpan = xs[n - 1] - xs[0];
  function yOf(energy) {
    return yBottom - ((energy - eLo) / (eHi - eLo)) * (yBottom - yTop);
  }
  function xOf(index) {
    return pad + (index / (n - 1)) * (w - 2 * pad);
  }
  function xOfX(xAngstrom) {
    return pad + ((xAngstrom - xs[0]) / xSpan) * (w - 2 * pad);
  }
  return {
    w, h, pad, n, xs, vs, yOf, xOf, xOfX,
    base: yOf(e0),
    barrierY: yOf(vBarrier),
    waveAmp,
    leftWell, rightWell, barrierIndex,
  };
}

function innerTurningPoints(e0) {
  const xs = DATA.x;
  const vs = DATA.v;
  let barrier = 0;
  for (let i = 1; i < xs.length; i++) {
    if (Math.abs(xs[i]) < Math.abs(xs[barrier])) barrier = i;
  }
  let left = null;
  for (let i = barrier; i > 0; i--) {
    const above = vs[i] - e0;
    const below = vs[i - 1] - e0;
    if (above * below <= 0) {
      const span = vs[i] - vs[i - 1];
      const t = Math.abs(span) < 1e-9 ? 0 : (e0 - vs[i - 1]) / span;
      left = xs[i - 1] + t * (xs[i] - xs[i - 1]);
      break;
    }
  }
  let right = null;
  for (let i = barrier; i < xs.length - 1; i++) {
    const above = vs[i] - e0;
    const below = vs[i + 1] - e0;
    if (above * below <= 0) {
      const span = vs[i + 1] - vs[i];
      const t = Math.abs(span) < 1e-9 ? 0 : (e0 - vs[i]) / span;
      right = xs[i] + t * (xs[i + 1] - xs[i]);
      break;
    }
  }
  if (left === null || right === null || right <= left) return null;
  return { left, right, width: right - left };
}

function fadeAlpha(y, h) {
  const edge = h * 0.16;
  if (y >= edge) return 0.78;
  if (y <= 0) return 0;
  return 0.78 * (y / edge);
}

function clipY(x0, y0, x1, y1, yMin, yMax) {
  let t0 = 0;
  let t1 = 1;
  const dx = x1 - x0;
  const dy = y1 - y0;
  function trim(p, q) {
    if (Math.abs(p) < 1e-9) return q >= 0;
    const r = q / p;
    if (p < 0) {
      if (r > t1) return false;
      if (r > t0) t0 = r;
    } else {
      if (r < t0) return false;
      if (r < t1) t1 = r;
    }
    return true;
  }
  if (!trim(-dy, y0 - yMin)) return null;
  if (!trim(dy, yMax - y0)) return null;
  if (t1 <= t0) return null;
  return [x0 + dx * t0, y0 + dy * t0, x0 + dx * t1, y0 + dy * t1];
}

function drawFadedSegment(x0, y0, x1, y1, h, fadeTop) {
  const clipped = clipY(x0, y0, x1, y1, 0, h);
  if (!clipped) return;
  const ax = clipped[0];
  const ay = clipped[1];
  const bx = clipped[2];
  const by = clipped[3];
  const steps = 6;
  for (let s = 0; s < steps; s++) {
    const t0 = s / steps;
    const t1 = (s + 1) / steps;
    const ya = ay + (by - ay) * t0;
    const yb = ay + (by - ay) * t1;
    const xa = ax + (bx - ax) * t0;
    const xb = ax + (bx - ax) * t1;
    const alpha = fadeAlpha(Math.min(ya, yb), h);
    if (alpha < 0.02) continue;
    ctx.strokeStyle = "rgba(176, 184, 236, " + alpha.toFixed(3) + ")";
    ctx.beginPath();
    ctx.moveTo(xa, ya);
    ctx.lineTo(xb, yb);
    ctx.stroke();
  }
}

function draw(state) {
  const geom = layoutOf(state.e0);
  const w = geom.w;
  const h = geom.h;
  const n = geom.n;
  const base = geom.base;
  ctx.globalCompositeOperation = "source-over";
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#0e0e10";
  ctx.fillRect(0, 0, w, h);
  const wash = ctx.createRadialGradient(w * 0.5, base, h * 0.04, w * 0.5, base, w * 0.55);
  wash.addColorStop(0, "rgba(31, 42, 138, 0.42)");
  wash.addColorStop(1, "rgba(14, 14, 16, 0)");
  ctx.fillStyle = wash;
  ctx.fillRect(0, 0, w, h);

  const vy = new Float64Array(n);
  for (let i = 0; i < n; i++) vy[i] = geom.yOf(geom.vs[i]);
  ctx.lineWidth = Math.max(1.25, h * 0.0035);
  ctx.lineCap = "round";
  const fadeTop = h * 0.16;
  for (let i = 0; i < n - 1; i++) {
    drawFadedSegment(geom.xOf(i), vy[i], geom.xOf(i + 1), vy[i + 1], h, fadeTop);
  }

  const turns = innerTurningPoints(state.e0);
  if (turns) drawForbidden(geom, vy, turns);

  const layer = glowLayer(w, h);
  const g = layer.getContext("2d");
  g.clearRect(0, 0, w, h);
  g.globalCompositeOperation = "lighter";
  let crestY = base;
  const waveY = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const energy = state.e0 + (state.density[i] / densityMax) * geom.waveAmp;
    waveY[i] = geom.yOf(energy);
    if (waveY[i] < crestY) crestY = waveY[i];
  }
  for (let i = 0; i < n - 1; i++) {
    const x0 = geom.xOf(i);
    const x1 = geom.xOf(i + 1);
    const hue = ((state.phase[i] + Math.PI) / TAU) * 360;
    const mid = (geom.xs[i] + geom.xs[i + 1]) * 0.5;
    const inWall = turns && mid >= turns.left && mid <= turns.right && state.density[i] > 0;
    g.fillStyle = inWall
      ? "hsla(" + hue.toFixed(1) + ", 94%, 74%, 1)"
      : "hsla(" + hue.toFixed(1) + ", 82%, 56%, 0.86)";
    g.beginPath();
    g.moveTo(x0, base);
    g.lineTo(x0, waveY[i]);
    g.lineTo(x1, waveY[i + 1]);
    g.lineTo(x1, base);
    g.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.shadowBlur = Math.max(18, h * 0.04);
  ctx.shadowColor = "rgba(150, 130, 255, 0.55)";
  ctx.drawImage(layer, 0, 0);
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.4;
  ctx.drawImage(layer, 0, 0);
  ctx.globalAlpha = 1;
  if (turns) drawTunnelTail(geom, waveY, turns);

  ctx.save();
  ctx.setLineDash([7, 8]);
  ctx.lineWidth = Math.max(1, h * 0.0022);
  ctx.strokeStyle = "rgba(214, 210, 236, 0.55)";
  ctx.beginPath();
  ctx.moveTo(geom.pad, base);
  ctx.lineTo(w - geom.pad, base);
  ctx.stroke();
  ctx.restore();

  const cdf = cumulative(state.density);
  ctx.globalCompositeOperation = "source-over";
  ctx.lineWidth = Math.max(1, h * 0.0024);
  ctx.lineCap = "round";
  let inside = 0;
  const time = clocks[active];
  for (let p = 0; p < NPART; p++) {
    const index = quantile(cdf, particleQ[p]);
    const crest = waveY[index];
    const span = base - crest;
    const x = geom.xOf(index) + Math.sin(time * 1.7 + p * 0.62) * Math.min(2.4, w * 0.004);
    let y;
    if (span < 3) {
      y = (crest + base) / 2;
    } else {
      const inset = Math.max(1.4, span * 0.14);
      const room = Math.max(0, span - 2 * inset);
      y = crest + inset + particleU[p] * room;
      y += Math.sin(time * 2.35 + p * 1.27) * Math.min(span * 0.07, 3.2);
      y = Math.min(base - 1.3, Math.max(crest + 1.3, y));
    }
    if (y > crest + 0.8 && y < base - 0.8) inside += 1;
    const trail = trails[p];
    trail.push(x, y);
    if (trail.length > 14) trail.splice(0, trail.length - 14);
    const hue = ((state.phase[index] + Math.PI) / TAU) * 360;
    const inWall = turns && geom.xs[index] >= turns.left && geom.xs[index] <= turns.right;
    for (let k = 2; k < trail.length; k += 2) {
      const fade = (k / trail.length) * (0.45 + flash * 0.25);
      ctx.strokeStyle = "hsla(" + hue.toFixed(1) + ", 80%, 76%, " + fade.toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(trail[k - 2], trail[k - 1]);
      ctx.lineTo(trail[k], trail[k + 1]);
      ctx.stroke();
    }
    const speck = inWall ? 0.98 : 0.88;
    ctx.fillStyle = "hsla(" + hue.toFixed(1) + ", " + (inWall ? 96 : 90) + "%, " + (inWall ? 84 : 78) + "%, " + (speck + flash * 0.12).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(x, y, Math.max(1.7, h * 0.0042) * (1 + flash * 0.35), 0, TAU);
    ctx.fill();
  }

  ctx.fillStyle = "rgba(214, 210, 236, 0.78)";
  ctx.font = Math.max(11, Math.floor(h * 0.022)) + "px ui-monospace, Menlo, Consolas, monospace";
  ctx.fillText("proton energy", geom.pad, base - Math.max(6, h * 0.012));
  ctx.fillStyle = "#c8c4e4";
  ctx.font = Math.max(12, Math.floor(h * 0.026)) + "px ui-monospace, Menlo, Consolas, monospace";
  const labelY = Math.min(h * 0.9, geom.yOf(geom.vs[geom.leftWell]) + h * 0.035);
  ctx.fillText("donor", geom.xOf(geom.leftWell) - 18, labelY);
  const acceptorLabel = "acceptor";
  ctx.fillText(acceptorLabel, geom.xOf(geom.rightWell) - ctx.measureText(acceptorLabel).width + 18, labelY);

  const movie = DATA.isotopes[active];
  const readout = active + "   " + movie.period_fs.toFixed(1) + " fs   ΔE " + movie.deltaE_meV.toFixed(2) + " meV   exact simulation";
  ctx.fillStyle = "#eeeafc";
  ctx.fillText(readout, geom.pad, h * 0.055);
  if (turns) {
    drawWallBracket(geom, turns);
    drawForbiddenLabel(geom, turns);
  }

  drawPanMeter(state.pan, w, h, geom.pad);
  const bloch = drawBlochSphere();
  window.__scene = {
    pan: state.pan,
    e0: state.e0,
    e0Y: base,
    energyMix: energyMix,
    barrierY: geom.barrierY,
    crestY: crestY,
    nParticles: NPART,
    inside: inside,
    wallLeft: turns ? turns.left : null,
    wallRight: turns ? turns.right : null,
    wallWidth: turns ? turns.width : null,
    edgeY: Math.min(vy[0], vy[n - 1]),
    shoulderY: vy[Math.max(0, geom.barrierIndex - 18)],
    bloch: bloch,
  };
}

function projectBloch(x, y, z, cx, cy, radius) {
  const tilt = 0.42;
  const xr = x * Math.cos(blochSpin) - y * Math.sin(blochSpin);
  const yr = x * Math.sin(blochSpin) + y * Math.cos(blochSpin);
  const y2 = yr * Math.cos(tilt) - z * Math.sin(tilt);
  const z2 = yr * Math.sin(tilt) + z * Math.cos(tilt);
  return { sx: cx + xr * radius, sy: cy - z2 * radius, depth: y2 };
}

function orientedBloch(x, y, z, mirror) {
  if (!mirror) return [x, y, z];
  return [x, -y, -z];
}

function drawBlochSphere() {
  const rect = canvas.getBoundingClientRect();
  const dpr = canvas.width / Math.max(1, rect.width);
  const radius = Math.min(70 * dpr, canvas.width * 0.12, canvas.height * 0.16);
  const margin = 16 * dpr;
  const cx = canvas.width - margin - radius;
  const cy = canvas.height - margin - radius - 28 * dpr;
  const frac = periodFraction(active);
  const mirror = mirrored[active];
  const sample = ATLAS && Array.isArray(ATLAS.points) && ATLAS.points.length
    ? ATLAS.points[pointIndex(frac, ATLAS.points.length)]
    : null;
  const measuredLength = sample ? Number(sample.bloch_length) : 1;

  ctx.save();
  ctx.globalCompositeOperation = "source-over";
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, TAU);
  ctx.fillStyle = "rgba(10, 12, 22, 0.72)";
  ctx.fill();
  ctx.lineWidth = Math.max(1, radius * 0.018);
  ctx.strokeStyle = "rgba(186, 194, 236, 0.7)";
  ctx.stroke();

  ctx.beginPath();
  for (let i = 0; i <= 48; i++) {
    const a = (i / 48) * TAU;
    const p = projectBloch(Math.cos(a), Math.sin(a), 0, cx, cy, radius);
    if (i === 0) ctx.moveTo(p.sx, p.sy);
    else ctx.lineTo(p.sx, p.sy);
  }
  ctx.strokeStyle = "rgba(168, 176, 220, 0.28)";
  ctx.stroke();

  ctx.beginPath();
  for (let i = 0; i <= 64; i++) {
    const theta = (i / 64) * TAU;
    const vector = orientedBloch(0, -Math.sin(theta), Math.cos(theta), mirror);
    const p = projectBloch(vector[0], vector[1], vector[2], cx, cy, radius);
    if (i === 0) ctx.moveTo(p.sx, p.sy);
    else ctx.lineTo(p.sx, p.sy);
  }
  ctx.strokeStyle = "rgba(214, 210, 255, 0.38)";
  ctx.stroke();

  if (sample) {
    const dots = ATLAS.points.map((point) => {
      const raw = orientedBloch(Number(point.x), Number(point.y), Number(point.z), mirror);
      const length = Math.hypot(raw[0], raw[1], raw[2]) || 1;
      const scale = Math.min(1, length) / length;
      const p = projectBloch(raw[0] * scale, raw[1] * scale, raw[2] * scale, cx, cy, radius);
      return p;
    });
    dots.sort((a, b) => a.depth - b.depth);
    for (const dot of dots) {
      ctx.shadowBlur = radius * 0.18;
      ctx.shadowColor = "rgba(228, 162, 58, 0.9)";
      ctx.fillStyle = "rgba(255, 214, 150, 0.95)";
      ctx.beginPath();
      ctx.arc(dot.sx, dot.sy, Math.max(1.6, radius * 0.035), 0, TAU);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  const liveScale = Math.min(1, measuredLength);
  const live = orientedBloch(0, -Math.sin(TAU * frac), Math.cos(TAU * frac), mirror);
  const liveDot = projectBloch(live[0] * liveScale, live[1] * liveScale, live[2] * liveScale, cx, cy, radius);
  ctx.shadowBlur = radius * 0.28;
  ctx.shadowColor = "rgba(190, 210, 255, 1)";
  ctx.fillStyle = "#f4f7ff";
  ctx.beginPath();
  ctx.arc(liveDot.sx, liveDot.sy, Math.max(2.4, radius * 0.055), 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = "rgba(228, 226, 255, 0.88)";
  ctx.font = Math.max(10, Math.floor(radius * 0.16)) + "px ui-monospace, Menlo, Consolas, monospace";
  const simulator = Boolean(ATLAS && (ATLAS.execution === "simulator" || ATLAS.provider === "aer"));
  const provider = ATLAS && ATLAS.provider ? ATLAS.provider : "aer";
  const shots = ATLAS && ATLAS.shots ? ATLAS.shots : 4096;
  const lines = [];
  let lengthLabel = "";
  if (measuredLength < 1) {
    if (simulator) {
      lengthLabel = "|r| = " + measuredLength.toFixed(2) + " · shot noise (" + shots + " shots, " + provider + " simulator)";
    } else {
      lengthLabel = "coherence |r| = " + measuredLength.toFixed(2);
    }
    lines.push(lengthLabel);
  } else if (simulator) {
    lines.push(provider + " simulator");
  }
  lines.forEach((line, index) => {
    const width = ctx.measureText(line).width;
    let x = cx - width * 0.5;
    const limit = canvas.width - 6 * dpr;
    if (x + width > limit) x = limit - width;
    if (x < 6 * dpr) x = 6 * dpr;
    ctx.fillText(line, x, cy - radius - 8 * dpr - (lines.length - 1 - index) * (12 * dpr));
  });
  ctx.restore();
  return {
    frac,
    length: measuredLength,
    inside: measuredLength < 1,
    label: lengthLabel,
    provider: ATLAS && ATLAS.provider ? ATLAS.provider : null,
    backend: ATLAS && ATLAS.backend ? ATLAS.backend : null,
  };
}

function drawForbidden(geom, vy, turns) {
  const base = geom.base;
  ctx.beginPath();
  ctx.moveTo(geom.xOfX(turns.left), base);
  let pen = false;
  for (let i = 0; i < geom.n; i++) {
    if (geom.xs[i] < turns.left || geom.xs[i] > turns.right) continue;
    const y = Math.min(vy[i], base);
    if (!pen) {
      ctx.lineTo(geom.xOf(i), y);
      pen = true;
    } else {
      ctx.lineTo(geom.xOf(i), y);
    }
  }
  ctx.lineTo(geom.xOfX(turns.right), base);
  ctx.closePath();
  ctx.fillStyle = "rgba(176, 190, 255, 0.09)";
  ctx.fill();
}

function drawTunnelTail(geom, waveY, turns) {
  ctx.save();
  ctx.shadowBlur = Math.max(14, geom.h * 0.028);
  ctx.shadowColor = "rgba(236, 228, 255, 0.95)";
  ctx.strokeStyle = "rgba(255, 250, 255, 0.8)";
  ctx.lineWidth = Math.max(1.4, geom.h * 0.0032);
  ctx.beginPath();
  let drawing = false;
  for (let i = 0; i < geom.n; i++) {
    if (geom.xs[i] < turns.left || geom.xs[i] > turns.right) {
      drawing = false;
      continue;
    }
    const x = geom.xOf(i);
    const y = waveY[i];
    if (!drawing) {
      ctx.moveTo(x, y);
      drawing = true;
    } else {
      ctx.lineTo(x, y);
    }
  }
  ctx.stroke();
  ctx.restore();
}

function drawWallBracket(geom, turns) {
  const y = geom.base;
  const x0 = geom.xOfX(turns.left);
  const x1 = geom.xOfX(turns.right);
  const tick = Math.max(6, geom.h * 0.014);
  ctx.save();
  ctx.strokeStyle = "rgba(236, 232, 255, 0.9)";
  ctx.lineWidth = Math.max(1.15, geom.h * 0.0024);
  ctx.beginPath();
  ctx.moveTo(x0, y - tick);
  ctx.lineTo(x0, y + tick);
  ctx.moveTo(x0, y);
  ctx.lineTo(x1, y);
  ctx.moveTo(x1, y - tick);
  ctx.lineTo(x1, y + tick);
  ctx.stroke();
  ctx.restore();
  const caption = "wall thickness at this energy: " + turns.width.toFixed(2) + " Å";
  const fontPx = Math.max(11, Math.floor(geom.h * 0.02));
  ctx.fillStyle = "rgba(236, 232, 255, 0.88)";
  ctx.font = fontPx + "px ui-monospace, Menlo, Consolas, monospace";
  const textW = ctx.measureText(caption).width;
  ctx.fillText(caption, (x0 + x1) * 0.5 - textW * 0.5, y + tick + fontPx + Math.max(2, geom.h * 0.006));
}

function drawForbiddenLabel(geom, turns) {
  ctx.fillStyle = "rgba(214, 216, 236, 0.78)";
  ctx.font = Math.max(10, Math.floor(geom.h * 0.018)) + "px ui-monospace, Menlo, Consolas, monospace";
  const label = "classically forbidden";
  const midX = geom.xOfX((turns.left + turns.right) * 0.5) - ctx.measureText(label).width * 0.5;
  const midY = (geom.base + geom.barrierY) * 0.5;
  ctx.fillText(label, midX, midY);
}

function drawPanMeter(pan, w, h, pad) {
  const y = h - Math.max(10, h * 0.016);
  const left = pad;
  const right = w - pad;
  ctx.strokeStyle = "rgba(168, 176, 230, 0.38)";
  ctx.lineWidth = Math.max(1, h * 0.002);
  ctx.beginPath();
  ctx.moveTo(left, y);
  ctx.lineTo(right, y);
  ctx.stroke();
  const x = left + ((pan + 1) / 2) * (right - left);
  ctx.shadowBlur = Math.max(10, h * 0.02);
  ctx.shadowColor = "rgba(188, 198, 255, 0.95)";
  ctx.fillStyle = "#e4e8ff";
  ctx.beginPath();
  ctx.arc(x, y, Math.max(3.4, h * 0.0065), 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function cumulative(density) {
  const cdf = new Float64Array(density.length);
  let sum = 0;
  for (let i = 0; i < density.length; i++) sum += density[i];
  if (sum <= 0) {
    for (let i = 0; i < density.length; i++) cdf[i] = (i + 1) / density.length;
    return cdf;
  }
  let acc = 0;
  for (let i = 0; i < density.length; i++) {
    acc += density[i] / sum;
    cdf[i] = acc;
  }
  return cdf;
}

function quantile(cdf, q) {
  let lo = 0;
  let hi = cdf.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (cdf[mid] < q) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

function introPanels(intro) {
  if (!intro) return null;
  if (Array.isArray(intro)) {
    if (!intro.length) return null;
    const last = intro.length - 1;
    return {
      donor: intro[0],
      teleblur: intro[Math.floor(last / 2)],
      acceptor: intro[last],
    };
  }
  if (intro.donor && intro.teleblur && intro.acceptor) return intro;
  return null;
}

function startIntro() {
  const panels = introPanels(INTRO);
  const begin = document.getElementById("begin");
  window.__introDone = !panels;
  if (!panels) return;
  document.getElementById("intro-donor").src = panels.donor;
  document.getElementById("intro-teleblur").src = panels.teleblur;
  document.getElementById("intro-acceptor").src = panels.acceptor;
  const overlay = document.getElementById("intro");
  begin.disabled = true;
  overlay.hidden = false;
  const started = performance.now();
  function tick(now) {
    if ((now - started) / 1000 >= 4.5) {
      overlay.hidden = true;
      begin.disabled = false;
      window.__introDone = true;
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
startIntro();

function beginAudio() {
  if (audio) return;
  const ctx = new AudioContext();
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, ctx.currentTime);
  master.connect(ctx.destination);
  master.gain.setTargetAtTime(0.42, ctx.currentTime, 0.18);

  const voice = ctx.createGain();
  voice.gain.setValueAtTime(1, ctx.currentTime);
  const panner = ctx.createStereoPanner();
  panner.pan.setValueAtTime(-1, ctx.currentTime);
  const dry = ctx.createGain();
  dry.gain.setValueAtTime(0.85, ctx.currentTime);
  const wet = ctx.createGain();
  wet.gain.setValueAtTime(0.28, ctx.currentTime);
  const convolver = ctx.createConvolver();
  convolver.buffer = decayingNoise(ctx);
  voice.connect(panner);
  panner.connect(dry);
  panner.connect(convolver);
  convolver.connect(wet);
  dry.connect(master);
  wet.connect(master);

  const partials = [];
  const weights = [0.22, 0.045, 0.02, 0.18, 0.035, 0.015];
  for (let i = 0; i < 6; i++) {
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(F0, ctx.currentTime);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.setTargetAtTime(weights[i], ctx.currentTime, 0.2);
    osc.connect(gain);
    gain.connect(voice);
    osc.start();
    partials.push(osc);
  }

  const bell = ctx.createOscillator();
  bell.type = "sine";
  bell.frequency.setValueAtTime(523.25, ctx.currentTime);
  const bellGain = ctx.createGain();
  bellGain.gain.setValueAtTime(0.0001, ctx.currentTime);
  bell.connect(bellGain);
  bellGain.connect(master);
  bell.start();
  const bell2 = ctx.createOscillator();
  bell2.type = "sine";
  bell2.frequency.setValueAtTime(784, ctx.currentTime);
  const bell2Gain = ctx.createGain();
  bell2Gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  bell2.connect(bell2Gain);
  bell2Gain.connect(master);
  bell2.start();

  audio = { ctx, master, panner, partials, bellGain, bell2Gain, beat: null };
  retune(ctx.currentTime);
  ctx.resume();
  const begin = document.getElementById("begin");
  begin.textContent = "Listening";
  begin.disabled = true;
}

function retune(now) {
  const beat = DATA.isotopes[active].f_beat_hz;
  if (audio.beat === beat) return;
  audio.beat = beat;
  const freqs = [F0, F0 * 2, F0 * 3, F0 + beat, (F0 + beat) * 2, (F0 + beat) * 3];
  for (let i = 0; i < audio.partials.length; i++) {
    const param = audio.partials[i].frequency;
    param.setValueAtTime(param.value, now);
    param.setTargetAtTime(freqs[i], now, 0.12);
  }
}

function followPan(state) {
  const now = audio.ctx.currentTime;
  if (audio.nextPan && now < audio.nextPan) return;
  audio.nextPan = now + 0.05;
  const target = state.pan;
  const pan = audio.panner.pan;
  pan.setValueAtTime(pan.value, now);
  pan.setTargetAtTime(target, now, 0.08);
}

function ringBell() {
  const now = audio.ctx.currentTime;
  for (const gain of [audio.bellGain, audio.bell2Gain]) {
    gain.gain.setTargetAtTime(0.0001, now, 0.01);
  }
  audio.bellGain.gain.setTargetAtTime(0.09, now + 0.02, 0.012);
  audio.bellGain.gain.setTargetAtTime(0.0001, now + 0.08, 0.28);
  audio.bell2Gain.gain.setTargetAtTime(0.03, now + 0.02, 0.01);
  audio.bell2Gain.gain.setTargetAtTime(0.0001, now + 0.06, 0.16);
}

function decayingNoise(ctx) {
  const seconds = 1.6;
  const length = Math.floor(ctx.sampleRate * seconds);
  const buffer = ctx.createBuffer(2, length, ctx.sampleRate);
  for (let channel = 0; channel < 2; channel++) {
    const data = buffer.getChannelData(channel);
    for (let i = 0; i < length; i++) {
      const envelope = Math.pow(1 - i / length, 2.8);
      data[i] = (Math.random() * 2 - 1) * envelope;
    }
  }
  return buffer;
}
